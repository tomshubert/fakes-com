<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fakes Office Usage</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--paper:#f4f8fc;--card:#fff;--ink:#0f1d30;--ink2:#4a5c72;--rule:#c2d4e8;--blue:#1f63a8;--band:#12365e}
@media (prefers-color-scheme: dark){:root{--paper:#0b1521;--card:#101c2b;--ink:#e6eef7;--ink2:#9fb1c6;--rule:#26394f;--blue:#7db4ea;--band:#0f2a48;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{background:var(--band);color:#eaf3fc;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header b{letter-spacing:.04em}
main{max-width:820px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
input,button{font:inherit;padding:6px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--card);color:var(--ink)}
button{background:var(--blue);color:#fff;border-color:var(--blue);cursor:pointer}
#status{color:var(--ink2)}
.org{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;margin:14px 0}
.org h2{font-size:18px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.org h2 span{font-size:14px;font-weight:400;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 4px;border-top:1px solid var(--rule)}
th:last-child,td:last-child{text-align:right}
.none{color:var(--ink2);margin:0}
</style>
</head>
<body>
<header><b>FAKES.COM</b> office usage</header>
<main>
  <div class="bar"><label for="month">Month</label> <input type="month" id="month"> <button id="signin" type="button" hidden>Sign in with Microsoft</button></div>
  <p id="status">Starting…</p>
  <div id="report"></div>
</main>
<script src="admin.js"></script>
</body>
</html>
